<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKTTA Terminal</title>
    <style>
        html, body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-bottom: 10px;
        }

        .input-area {
            display: flex;
            align-items: center;
            width: 100%;
        }

        #prompt {
            color: #00ff00;
            margin-right: 8px;
        }

        #terminal-input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }

        a {
            color: #00aaff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        #ascii-art {
            white-space: pre;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
        }

        @keyframes blink-animation {
            to {
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="terminal-output"></div>
        <div class="input-area">
            <div id="prompt">$</div>
            <input type="text" id="terminal-input" autofocus spellcheck="false">
        </div>
    </div>

    <script>
        // Terminal configuration
        const config = {
            promptSymbol: '$',
            welcomeMessage: `Welcome to the GKTTA Terminal v1.0.0
Type 'help' for available commands.

`,
            asciiArt: `
   ___ _  _______ _____ _   
  / __| |/ /_   _|_   _/_\  
 | (_ | ' <  | |   | |/ _ \ 
  \___|_|\_\ |_|   |_/_/ \_\
`
        };

        // DOM elements
        const terminalOutput = document.getElementById('terminal-output');
        const terminalInput = document.getElementById('terminal-input');
        const prompt = document.getElementById('prompt');

        // Terminal state
        const commandHistory = [];
        let historyIndex = -1;
        let isPasswordMode = false;
        let passwordCallback = null;

        // Initialize terminal
        function initTerminal() {
            writeToTerminal(config.asciiArt);
            writeToTerminal(config.welcomeMessage);
            terminalInput.focus();
        }

        // Write text to terminal
        function writeToTerminal(text, withPrompt = false) {
            if (withPrompt) {
                terminalOutput.innerHTML += `<div>${config.promptSymbol} ${text}</div>`;
            } else {
                terminalOutput.innerHTML += text;
            }
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Clear terminal
        function clearTerminal() {
            terminalOutput.innerHTML = '';
        }

        // Command processing
        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const input = terminalInput.value;
                
                if (isPasswordMode && passwordCallback) {
                    writeToTerminal('********\n', true);
                    const pass = input;
                    isPasswordMode = false;
                    terminalInput.type = 'text';
                    passwordCallback(pass);
                } else {
                    // Add to history and output
                    if (input.trim() !== '') {
                        commandHistory.push(input);
                        historyIndex = commandHistory.length;
                    }
                    writeToTerminal(input + '\n', true);
                    
                    // Process command
                    processCommand(input);
                }
                
                // Clear input
                terminalInput.value = '';
            } 
            else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    terminalInput.value = commandHistory[historyIndex];
                }
                e.preventDefault();
            } 
            else if (e.key === 'ArrowDown') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    terminalInput.value = commandHistory[historyIndex];
                } else {
                    terminalInput.value = '';
                    historyIndex = commandHistory.length;
                }
                e.preventDefault();
            }
        });

        // Password mode function
        function askPassword(callback) {
            isPasswordMode = true;
            terminalInput.type = 'password';
            writeToTerminal('Enter password: ', true);
            passwordCallback = callback;
        }

        // Process commands
        function processCommand(command) {
            const cmd = command.trim().toLowerCase();
            
            if (cmd === '') {
                return;
            } else if (cmd === 'help') {
                writeToTerminal(`Available commands:
  help       - Display this help message
  clear      - Clear the terminal
  about      - About GKTTA
  date       - Display current date and time
  echo       - Echo the input
  whoami     - Display current user
  login      - Login to GKTTA system
  ls         - List directory contents
  cat        - View file contents
  links      - Show important links
`);
            } else if (cmd === 'clear') {
                clearTerminal();
            } else if (cmd === 'about') {
                writeToTerminal(`GKTTA - Grand Knights of the Technological Temple Alliance

The Grand Knights of the Technological Temple Alliance (GKTTA) is dedicated to the preservation and advancement of technological knowledge and digital sovereignty.

Founded in 2023, our mission is to promote digital literacy, ethical computing, and free access to information for all.
`);
            } else if (cmd === 'date') {
                writeToTerminal(new Date().toString() + '\n');
            } else if (cmd.startsWith('echo ')) {
                writeToTerminal(command.substring(5) + '\n');
            } else if (cmd === 'whoami') {
                writeToTerminal('guest\n');
            } else if (cmd === 'login') {
                askPassword(function(password) {
                    if (password === 'password123') {
                        writeToTerminal('Login successful. Welcome, Knight.\n');
                    } else {
                        writeToTerminal('Login failed. Invalid password.\n');
                    }
                });
            } else if (cmd === 'ls') {
                writeToTerminal(`README.md
about.txt
manifesto.txt
members.dat [encrypted]
resources/
`);
            } else if (cmd.startsWith('cat ')) {
                const file = cmd.substring(4).trim();
                if (file === 'readme.md') {
                    writeToTerminal(`# GKTTA Terminal Interface

This terminal interface provides access to GKTTA resources and information.
Use 'help' command to see available options.

## Security Notice
Some files and commands require authentication.
`);
                } else if (file === 'about.txt') {
                    writeToTerminal(`The Grand Knights of the Technological Temple Alliance

We are dedicated to:
- Promoting digital literacy
- Protecting privacy rights
- Ensuring ethical use of technology
- Preserving digital history and knowledge
`);
                } else if (file === 'manifesto.txt') {
                    writeToTerminal(`GKTTA MANIFESTO

1. Technology should serve humanity, not control it.
2. Knowledge must be free and accessible to all.
3. Privacy is a fundamental right in the digital age.
4. We preserve the history and evolution of computing.
5. We promote ethical development and use of technology.
`);
                } else if (file === 'members.dat') {
                    writeToTerminal('Error: Cannot read encrypted file without proper authorization.\n');
                } else {
                    writeToTerminal(`cat: ${file}: No such file or directory\n`);
                }
            } else if (cmd === 'links') {
                writeToTerminal(`Important Links:
- <a href="https://github.com/popvoxmatt/GKTTA" target="_blank">GitHub Repository</a>
- <a href="https://www.example.com/gktta-forum" target="_blank">GKTTA Forum</a>
- <a href="https://www.example.com/resources" target="_blank">Resources</a>
`);
            } else {
                writeToTerminal(`Command not found: ${command}
Type "help" for available commands.\n`);
            }
        }

        // Keep focus on input
        document.addEventListener('click', function() {
            terminalInput.focus();
        });

        // Initialize terminal on load
        window.onload = initTerminal;
    </script>
</body>
</html>
