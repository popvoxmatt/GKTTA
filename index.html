<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        #terminal {
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            padding-bottom: 2em;
        }
        
        #input-line {
            display: flex;
            align-items: center;
        }
        
        #prompt {
            margin-right: 5px;
        }
        
        #command-input {
            flex: 1;
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            outline: none;
            caret-color: #00ff00;
        }
        
        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    
    <script>
        const terminal = document.getElementById('terminal');
        let history = [];
        let historyIndex = -1;
        
        // Add initial welcome message
        appendOutput("Welcome to Terminal v1.0.0\nType 'help' for available commands.\n");
        
        // Create and append input line
        createInputLine();
        
        function createInputLine() {
            const inputLine = document.createElement('div');
            inputLine.id = 'input-line';
            
            const prompt = document.createElement('span');
            prompt.id = 'prompt';
            prompt.textContent = '$ ';
            
            const commandInput = document.createElement('input');
            commandInput.id = 'command-input';
            commandInput.type = 'text';
            commandInput.autofocus = true;
            
            inputLine.appendChild(prompt);
            inputLine.appendChild(commandInput);
            
            terminal.appendChild(inputLine);
            
            commandInput.focus();
            
            // Event listeners
            commandInput.addEventListener('keydown', handleKeyDown);
        }
        
        function handleKeyDown(event) {
            const commandInput = document.getElementById('command-input');
            
            if (event.key === 'Enter') {
                const command = commandInput.value;
                
                // Add command to history
                if (command.trim() !== '') {
                    history.push(command);
                    historyIndex = history.length;
                }
                
                // Display command in terminal
                appendOutput('$ ' + command + '\n');
                
                // Process command
                processCommand(command);
                
                // Remove input line
                const inputLine = document.getElementById('input-line');
                terminal.removeChild(inputLine);
                
                // Create new input line
                createInputLine();
                
                event.preventDefault();
            } else if (event.key === 'ArrowUp') {
                // Navigate history (previous command)
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = history[historyIndex];
                }
                event.preventDefault();
            } else if (event.key === 'ArrowDown') {
                // Navigate history (next command)
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    commandInput.value = history[historyIndex];
                } else if (historyIndex === history.length - 1) {
                    historyIndex = history.length;
                    commandInput.value = '';
                }
                event.preventDefault();
            }
        }
        
        function processCommand(command) {
            const cmd = command.trim().toLowerCase();
            
            if (cmd === '') {
                return;
            } else if (cmd === 'help') {
                appendOutput('Available commands:\n');
                appendOutput('  help     - Display this help message\n');
                appendOutput('  clear    - Clear the terminal\n');
                appendOutput('  date     - Display current date and time\n');
                appendOutput('  echo     - Echo the input\n');
                appendOutput('  whoami   - Display current user\n');
            } else if (cmd === 'clear') {
                clearTerminal();
            } else if (cmd === 'date') {
                appendOutput(new Date().toString() + '\n');
            } else if (cmd.startsWith('echo ')) {
                appendOutput(command.substring(5) + '\n');
            } else if (cmd === 'whoami') {
                appendOutput('guest\n');
            } else {
                appendOutput('Command not found: ' + command + '\n');
                appendOutput('Type "help" for available commands.\n');
            }
        }
        
        function appendOutput(text) {
            const output = document.createElement('div');
            output.textContent = text;
            terminal.insertBefore(output, document.getElementById('input-line'));
            
            // Scroll to bottom
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function clearTerminal() {
            // Remove all children except the input line
            while (terminal.firstChild !== document.getElementById('input-line')) {
                terminal.removeChild(terminal.firstChild);
            }
        }
        
        // Keep focus on input
        document.addEventListener('click', function() {
            document.getElementById('command-input').focus();
        });
    </script>
</body>
</html>
