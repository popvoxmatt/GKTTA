<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Key Society Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@4.5.0/index.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a1a;
            --text-color: #ffd700;
            --ascii-color: #c0c0c0;
            --link-color: #ffa500;
            --error-color: #ff4545;
            --success-color: #45ff45;
            --warning-color: #ffff45;
            --inactive-color: #777;
            --scanline-color: rgba(0, 0, 0, 0.1);
            --glow-color: rgba(255, 215, 0, 0.3);
            --crystal-color: #a0ffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: black;
            font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #terminal-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            padding: 20px;
            transition: all 0.3s ease;
        }

        #terminal {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        #terminal::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        #input-line {
            display: flex;
            color: var(--text-color);
            font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
            margin-top: 10px;
            position: sticky;
            bottom: 0;
            background-color: var(--bg-color);
        }

        #prompt {
            margin-right: 8px;
        }

        #input {
            background: transparent;
            border: none;
            outline: none;
            caret-color: var(--text-color);
            color: var(--text-color);
            font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
            flex-grow: 1;
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 5px;
            position: relative;
        }

        .ascii-art {
            color: var(--ascii-color);
            white-space: pre;
            font-family: monospace;
            line-height: 1.2;
            margin: 20px 0;
            font-size: 0.8rem;
        }

        .error {
            color: var(--error-color);
        }

        .success {
            color: var(--success-color);
        }

        .warning {
            color: var(--warning-color);
        }

        .crystal {
            color: var(--crystal-color);
            text-shadow: 0 0 5px var(--crystal-color);
        }

        .link {
            color: var(--link-color);
            text-decoration: underline;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        /* CRT Effects */
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .crt::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.2) 90%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
            z-index: 9;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                var(--scanline-color) 51%,
                transparent 51%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 8;
            opacity: 0.3;
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px var(--glow-color);
            pointer-events: none;
            z-index: 7;
        }

        /* Flickering effect */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.9; }
            10% { opacity: 0.97; }
            15% { opacity: 0.92; }
            20% { opacity: 0.97; }
            25% { opacity: 0.93; }
            30% { opacity: 0.97; }
            35% { opacity: 0.9; }
            40% { opacity: 0.97; }
            45% { opacity: 0.94; }
            50% { opacity: 0.98; }
            55% { opacity: 0.91; }
            60% { opacity: 0.97; }
            65% { opacity: 0.92; }
            70% { opacity: 0.97; }
            75% { opacity: 0.93; }
            80% { opacity: 0.97; }
            85% { opacity: 0.9; }
            90% { opacity: 0.97; }
            95% { opacity: 0.96; }
            100% { opacity: 0.97; }
        }

        .flicker {
            animation: flicker 4s infinite;
        }

        /* Portal active effects - ENHANCED */
        .portal-active #terminal-container {
            animation: portal-background 3s ease infinite;
        }

        @keyframes portal-background {
            0% { background-color: var(--bg-color); }
            33% { background-color: #0f1a3a; }
            66% { background-color: #1a0f3a; }
            100% { background-color: var(--bg-color); }
        }

        .portal-active .output-line {
            position: relative;
        }

        .portal-active .output-line.glitch {
            animation: glitch-text 0.4s ease;
        }

        @keyframes glitch-text {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); color: #a0ffff; }
            40% { transform: translate(2px, -1px); color: var(--text-color); }
            60% { transform: translate(-1px, -1px); color: #ff9900; }
            80% { transform: translate(1px, 1px); color: var(--text-color); }
            100% { transform: translate(0); }
        }

        .portal-active .heavy-glitch {
            animation: heavy-glitch 0.2s ease infinite;
        }

        @keyframes heavy-glitch {
            0% { transform: translate(0); opacity: 1; }
            10% { transform: translate(-5px, 2px); opacity: 0.8; }
            20% { transform: translate(5px, -2px); opacity: 0.9; }
            30% { transform: translate(-3px, -3px); opacity: 0.7; }
            40% { transform: translate(3px, 3px); opacity: 0.9; }
            50% { transform: translate(-2px, -1px); opacity: 0.8; }
            60% { transform: translate(2px, 1px); opacity: 1; }
            70% { transform: translate(-1px, 2px); opacity: 0.9; }
            80% { transform: translate(1px, -2px); opacity: 0.8; }
            90% { transform: translate(-2px, 1px); opacity: 0.9; }
            100% { transform: translate(0); opacity: 1; }
        }

        /* Crystal glow effect */
        .crystal-glow {
            animation: crystal-pulse 2s ease-in-out infinite;
        }

        @keyframes crystal-pulse {
            0% { text-shadow: 0 0 4px var(--crystal-color); }
            50% { text-shadow: 0 0 12px var(--crystal-color), 0 0 20px var(--crystal-color); }
            100% { text-shadow: 0 0 4px var(--crystal-color); }
        }

        /* VHS tracking effect */
        .portal-active .tracking-glitch {
            animation: tracking 0.3s linear;
            animation-iteration-count: 1;
        }

        @keyframes tracking {
            0% { transform: translateY(0); }
            20% { transform: translateY(-10px); }
            35% { transform: translateY(5px); }
            50% { transform: translateY(-2px); }
            65% { transform: translateY(0); }
            85% { transform: translateY(-1px); }
            100% { transform: translateY(0); }
        }

        /* Digital distortion */
        .portal-active .digital-corruption {
            position: relative;
            display: inline-block;
        }

        .portal-active .digital-corruption::before {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            text-shadow: -1px 0 #00ffff;
            top: 0;
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: glitch-corruption 2s linear alternate-reverse;
        }

        .portal-active .digital-corruption::after {
            content: attr(data-text);
            position: absolute;
            left: -2px;
            text-shadow: 1px 0 #ff00ff;
            top: 0;
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: glitch-corruption 3s linear alternate-reverse;
        }

        @keyframes glitch-corruption {
            0% { clip: rect(42px, 9999px, 44px, 0); }
            5% { clip: rect(12px, 9999px, 59px, 0); }
            10% { clip: rect(48px, 9999px, 29px, 0); }
            15% { clip: rect(42px, 9999px, 73px, 0); }
            20% { clip: rect(63px, 9999px, 27px, 0); }
            25% { clip: rect(34px, 9999px, 55px, 0); }
            30% { clip: rect(86px, 9999px, 73px, 0); }
            35% { clip: rect(20px, 9999px, 20px, 0); }
            40% { clip: rect(26px, 9999px, 60px, 0); }
            45% { clip: rect(25px, 9999px, 66px, 0); }
            50% { clip: rect(57px, 9999px, 98px, 0); }
            55% { clip: rect(5px, 9999px, 46px, 0); }
            60% { clip: rect(82px, 9999px, 31px, 0); }
            65% { clip: rect(54px, 9999px, 27px, 0); }
            70% { clip: rect(28px, 9999px, 99px, 0); }
            75% { clip: rect(45px, 9999px, 59px, 0); }
            80% { clip: rect(23px, 9999px, 67px, 0); }
            85% { clip: rect(54px, 9999px, 84px, 0); }
            90% { clip: rect(45px, 9999px, 47px, 0); }
            95% { clip: rect(37px, 9999px, 20px, 0); }
            100% { clip: rect(4px, 9999px, 91px, 0); }
        }

        /* Full screen button */
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--inactive-color);
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 20;
            transition: color 0.3s;
            font-size: 1.2rem;
        }

        #fullscreen-btn:hover {
            color: var(--text-color);
        }

        /* Password input field */
        .password-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
            font-size: 1rem;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--text-color);
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Power button effect */
        .power-btn {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .power-btn.on {
            background-color: var(--success-color);
            box-shadow: 0 0 5px var(--success-color);
        }

        .power-btn.off {
            background-color: var(--error-color);
            box-shadow: 0 0 5px var(--error-color);
        }

        .power-btn.standby {
            background-color: var(--warning-color);
            box-shadow: 0 0 5px var(--warning-color);
        }

        /* Command suggestions */
        #suggestions {
            margin-top: 5px;
            color: var(--inactive-color);
            font-size: 0.9rem;
            position: sticky;
            bottom: 0;
            background-color: var(--bg-color);
        }

        #suggestion-text {
            cursor: pointer;
        }

        #suggestion-text:hover {
            color: var(--text-color);
        }

        /* Cursor animation */
        @keyframes blink-cursor {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1em;
            background-color: var(--text-color);
            animation: blink-cursor 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        /* Boot sequence */
        .boot-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .boot-progress {
            width: 60%;
            height: 10px;
            background-color: #222;
            margin-top: 20px;
            position: relative;
        }

        .boot-bar {
            position: absolute;
            height: 100%;
            background-color: var(--text-color);
            width: 0%;
            transition: width 0.5s ease;
        }

        .boot-text {
            margin-top: 10px;
            font-size: 14px;
        }

        /* Crystal overlay effect */
        .crystal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 90%, var(--crystal-color) 150%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s;
            z-index: 15;
        }

        .portal-active .crystal-overlay {
            opacity: 0.12;
        }
    </style>
</head>
<body>
    <div id="boot-sequence" class="boot-animation">
        <div class="boot-text" style="font-size: 20px; margin-bottom: 30px;">Initializing Golden Key Society Terminal</div>
        <div class="boot-progress">
            <div id="boot-bar" class="boot-bar"></div>
        </div>
        <div id="boot-text" class="boot-text">Loading system components...</div>
    </div>

    <div id="terminal-container" class="crt">
        <div class="scanlines"></div>
        <div class="glow"></div>
        <div class="crystal-overlay"></div>
        <button id="fullscreen-btn"><i class="fas fa-expand"></i></button>
        <div id="terminal" class="flicker">
            <!-- Terminal output will be displayed here -->
        </div>
        <div id="input-line">
            <span id="prompt">GKS></span>
            <input type="text" id="input" autofocus spellcheck="false">
        </div>
        <div id="suggestions">
            <span id="suggestion-text"></span>
        </div>
    </div>

    <audio id="keySound" src="https://cdn.jsdelivr.net/gh/zap-zsh/sounds@master/mechanical-keyboard.mp3" preload="auto"></audio>
    <audio id="portalSound" src="https://cdn.jsdelivr.net/gh/stebsnusch/audio-bucket@main/portal-hum.mp3" preload="auto" loop></audio>
    <audio id="errorSound" src="https://cdn.jsdelivr.net/gh/stebsnusch/audio-bucket@main/error-beep.mp3" preload="auto"></audio>
    <audio id="successSound" src="https://cdn.jsdelivr.net/gh/stebsnusch/audio-bucket@main/success-chime.mp3" preload="auto"></audio>
    <audio id="crystalSound" src="https://cdn.jsdelivr.net/gh/stebsnusch/audio-bucket@main/crystal-ping.mp3" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Boot sequence
            const bootBar = document.getElementById('boot-bar');
            const bootText = document.getElementById('boot-text');
            const bootSequence = document.getElementById('boot-sequence');
            
            const bootMessages = [
                "Initializing system...",
                "Loading GKS Core v3.7.2...",
                "Establishing quantum link...",
                "Calibrating temporal stabilizers...",
                "Scanning for anomalies...",
                "Initializing portal protocols...",
                "Verifying security parameters...",
                "Checking crystal resonance patterns...",
                "Loading dimensional coordinates...",
                "Golden Key Society Terminal ready."
            ];
            
            let bootProgress = 0;
            const bootInterval = setInterval(() => {
                bootProgress += 10;
                bootBar.style.width = `${bootProgress}%`;
                bootText.textContent = bootMessages[bootProgress / 10 - 1];
                
                if (bootProgress >= 100) {
                    clearInterval(bootInterval);
                    setTimeout(() => {
                        bootSequence.style.display = 'none';
                        init();
                    }, 1000);
                }
            }, 600);

            // Initialize terminal
            function init() {
                const terminal = document.getElementById('terminal');
                const input = document.getElementById('input');
                const promptSpan = document.getElementById('prompt');
                const suggestions = document.getElementById('suggestion-text');
                const fullscreenBtn = document.getElementById('fullscreen-btn');
                
                // Sound effects
                const keySound = document.getElementById('keySound');
                const portalSound = document.getElementById('portalSound');
                const errorSound = document.getElementById('errorSound');
                const successSound = document.getElementById('successSound');
                const crystalSound = document.getElementById('crystalSound');

                // Variables
                let commandHistory = [];
                let historyIndex = -1;
                let isAuthenticated = false;
                let currentUser = 'Trainee';
                let isPortalActive = false;
                let portalTarget = null;
                let temporalAnomaly = Math.random() * 100;
                let secretCommandsFound = 0;
                let totalSecretCommands = 7;
                let currentDirectory = '/';
                
                // File system structure - enhanced with new lore

                        'emergency.txt': 'EMERGENCY PROCEDURES:\n\nIn case of temporal collapse:\n1. Deactivate portal IMMEDIATELY\n2. Contact Temporal Control (x7734)\n3. Initiate Protocol Zeta-9\n4. If Zeta-9 fails, use override code: TIMEFALL-OMEGA',
                        'clearance_levels.txt': 'GKS CLEARANCE LEVELS:\n\nLevel 1: Trainee - Basic system access\nLevel 2: Agent - Field operations\nLevel 3: Operator - Portal activation\nLevel 4: Controller - Dimensional navigation\nLevel 5: Director - Full system access',
                        'dimensional_theory.pdf': '[ENCRYPTED FILE] - Requires Level 4 clearance',
                        'crystal_handling.txt': 'CRYSTAL HANDLING PROCEDURES:\n\nMoonbeam Crystals are HIGHLY SENSITIVE to electromagnetic fields!\n\n1. Always use insulated equipment when handling\n2. Store in lead-lined containers when not in use\n3. Keep minimum distance of 3 meters from active portal apparatus\n4. If crystal begins to pulse with light, EVACUATE IMMEDIATELY\n5. Report any unusual resonance patterns to Crystal Research Team'
                    },
                    'logs': {
                        'jump_log_1970.txt': 'JUMP LOG 1970:\n\nJAN 12 - London 1895 - Agent Miller - Successful\nMAR 04 - Paris 1789 - Agent Thompson - Successful\nJUN 18 - Moonbeam Hollow - Agent Davis - ANOMALY DETECTED\nSEP 23 - Vienna 1809 - Agent Wilson - Successful\nDEC 10 - New York 1929 - Agent Moore - Temporal shift detected',
                        'incident_report_42.txt': 'INCIDENT REPORT #42:\n\nDate: June 19, 1970\nLocation: Moonbeam Hollow\nAgent: Davis, J.\n\nDuring routine exploration of dimensional variant, agent reported temporal echo effect. Objects appeared to "remember" being moved. Local resident at coordinates MBH-334 (identified as "Hollow Keeper") displayed awareness of our operations. Recommend avoiding this sector until further notice.',
                        'maintenance_log.txt': 'MAINTENANCE LOG:\n\nMAY 15, 1970 - Quantum stabilizer replaced\nJUL 03, 1970 - Temporal calibration performed\nAUG 28, 1970 - Portal core cooling system upgraded\nOCT 11, 1970 - Dimensional anchor points recalibrated\nNOV 30, 1970 - Emergency shutdown system tested - SUCCESSFUL',
                        'agent_status.dat': '[ENCRYPTED FILE] - Requires Level 3 clearance',
                        'crystal_acquisition.txt': 'CRYSTAL ACQUISITION LOG:\n\nFEB 14, 1970 - Expedition to Moonbeam Hollow. 3.2 kg of raw time crystals extracted\nAPR 22, 1970 - Treaty signed with Hollow Keepers for regulated crystal mining\nJUL 17, 1970 - First refined crystal batch (0.8 kg) delivered to Research\nOCT 05, 1970 - Mining operation expanded to northern caverns\nDEC 24, 1970 - Annual quota fulfilled (12 kg). Mining paused until Jan 15'

                    'locations': {
                        'moonbeam_manor.txt': 'LOCATION FILE: MOONBEAM MANOR\n\nCoordinates: HOME DIMENSION\nTemporal Access: Unrestricted\nStatus: GKS HEADQUARTERS\nNotes: Primary operations base established 1952. Temporal shielding active. Safe return point for all operations.\n\nFounding: Selected as GKS HQ due to natural dimensional weak point located beneath the east wing. Portal anomaly first detected in 1932 by Dr. Eleanor Wright during geomagnetic studies.\n\nStructure: Victorian architecture with significant modifications for temporal research facilities. Sublevels 1-4 house portal apparatus and crystal refinement facilities.',
                        'moonbeam_hollow.txt': 'LOCATION FILE: MOONBEAM HOLLOW\n\nCoordinates: DIM-MBH-1\nTemporal Access: RESTRICTED (Auth. Level 3+)\nStatus: UNDER OBSERVATION\nNotes: Dimensional variant of Moonbeam Manor location. Exhibits temporal anomalies. Time flows differently.\n\nInhabitants: Primary contact - "The Hollow Keeper" (appears humanoid, extreme longevity). Secondary population consists of crystalline-based entities with limited sentience.\n\nResources: Contains large deposits of temporal crystals essential to GKS operations. Mining operations established under treaty agreements with Hollow Keeper.\n\nWARNING: Unauthorized crystal harvesting strictly prohibited.',
                        'london_1888.txt': 'LOCATION FILE: LONDON 1888\n\nCoordinates: TL-18881025\nTemporal Access: Authorized\nStatus: OBSERVATION ONLY\nNotes: Victorian era. High fog levels provide good cover. Avoid Scotland Yard. Known historical figures active in area. Paradox risk: MODERATE.',

                function listFiles(dirArg) {
                    // Parse the path
                    let targetDir = dirArg || '';
                    let currentDirObj = getCurrentDirectoryObject();
                    
                    // If a path is specified, resolve it
                    if (targetDir) {
                        if (targetDir === '..') {
                            if (currentDirectory === '/') {
                                output('Already at root directory.');
                                return;
                            }
                            // Go up one level
                            const parts = currentDirectory.split('/').filter(p => p);
                            parts.pop();
                            targetDir = '/' + parts.join('/');
                            if (targetDir === '') targetDir = '/';
                        } else if (targetDir === '\\' || targetDir === '/') {
                            targetDir = '/';
                        } else {
                            // Resolve relative path
                            if (!currentDirObj[targetDir]) {
                                output(`Directory not found: ${targetDir}`, 'error');
                                return;
                            }
                            if (currentDirectory === '/') {
                                targetDir = '/' + targetDir;
                            } else {
                                targetDir = currentDirectory + '/' + targetDir;
                            }
                        }
                        
                        // Update current dir object based on new path
                        currentDirObj = getDirectoryObjectFromPath(targetDir);
                        if (!currentDirObj) {
                            output(`Directory not found: ${targetDir}`, 'error');
                            return;
                        }
                    }
                    
                    // Display files in directory
                    const dirName = targetDir || currentDirectory;
                    output(`

                    // Count files and directories
                    let fileCount = 0;
                    let dirCount = 0;
                    
                    // List parent directory if not at root
                    if (dirName !== '/') {
                        output('<DIR>     ..        Parent Directory');
                        dirCount++;
                    }
                    
                    // List contents
                    for (const item in currentDirObj) {
                        if (typeof currentDirObj[item] === 'object') {
                            output(`<DIR>     ${item.padEnd(10)} Directory`);
                            dirCount++;

                            // Get file size estimate based on content length
                            const fileContent = currentDirObj[item];
                            const fileSize = fileContent.length;

                function getCurrentDirectoryObject() {
                    if (currentDirectory === '/') {
                        return fileSystem;
                    }
                    
                    const parts = currentDirectory.split('/').filter(p => p);
                    let current = fileSystem;
                    
                    for (const part of parts) {
                        if (current[part] && typeof current[part] === 'object') {
                            current = current[part];
                        } else {
                            return null;
                        }
                    }
                    
                    return current;
                }

                function getDirectoryObjectFromPath(path) {
                    if (path === '/') {
                        return fileSystem;
                    }
                    
                    const parts = path.split('/').filter(p => p);
                    let current = fileSystem;
                    
                    for (const part of parts) {
                        if (current[part] && typeof current[part] === 'object') {
                            current = current[part];
